name: app_calls
description: "Εφαρμογή κλήσεων με sync (μέρος του multiplatform app suite από FANDCS)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI ---
  cupertino_icons: ^1.0.6

  # --- Κλήσεις / Τηλεφωνία (Android only) ---
  # Call log ιστορικό
  call_log: ^6.0.1
  # Επαφές συσκευής
  flutter_contacts: ^2.2.2
  # Κλήση αριθμού μέσω system dialer intent (fallback/hand-off χρήση)
  url_launcher: ^6.2.5
  # Απευθείας κλήση με ένα πάτημα (ACTION_CALL)
  flutter_phone_direct_caller: ^2.1.1
  # Permissions runtime (READ_CALL_LOG, CALL_PHONE)
  permission_handler: ^12.0.3

  # --- State management ---
  provider: ^6.1.2

  # --- Utilities ---
  uuid: ^4.4.0

  # --- Local storage (offline-first cache + ρυθμίσεις) ---
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2

  # --- Θα προστεθεί αργότερα όταν φτιάξουμε το shared-sync-core ---
  # shared_sync_core:
  #   path: ../shared-sync-core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# --- Ρυθμίσεις Εικονιδίου Εφαρμογής ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/phonelefter_trans.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
